<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Post an Item — GoodsExchange</title><style>:root{--g:#16735c;--ink:#15261f;--muted:#66756e;--line:#dce7e2;--bg:#f8fbf9}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg)}.wrap{max-width:850px;margin:auto;padding:0 22px}header{background:white;border-bottom:1px solid var(--line)}nav{height:70px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:800}.logo span{color:var(--g)}main{padding:55px 0}.box{background:white;border:1px solid var(--line);border-radius:18px;padding:32px}h1{font-size:38px;margin:0 0 8px}.intro,.note{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}label{font-size:13px;font-weight:750;display:block;margin-bottom:6px}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:12px;border:1px solid #cddbd4;border-radius:8px;font:inherit}textarea{min-height:120px}.upload{padding:25px;text-align:center;border:1.5px dashed #b8cbc2;border-radius:9px;color:var(--muted)}.check{display:flex;gap:8px;margin:20px 0;color:var(--muted);font-size:13px}.check input{width:auto}.btn{border:0;background:var(--g);color:white;padding:13px 20px;border-radius:9px;font-weight:800}.note{margin-top:18px;background:#eaf5f0;padding:14px;border-radius:9px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class='wrap'><nav><a class='logo' href='index.html'>Goods<span>Exchange</span></a><a href='index.html'>← Home</a></nav></div></header><main><div class='wrap'><div class='box'><h1>Post an item for exchange</h1><p class='intro'>This is the initial structure for the future listing system.</p><form onsubmit="event.preventDefault();alert('Demo only. In the live version, this listing will be saved to the database.');"><div class='grid'><div class='full'><label>Item title</label><input placeholder='e.g. iPhone 13 128GB'></div><div><label>Category</label><select><option>Select category</option><option>Mobiles</option><option>Electronics</option><option>Furniture</option><option>Bikes</option><option>Appliances</option><option>Other</option></select></div><div><label>City</label><select><option>Select city</option><option>Karachi</option><option>Lahore</option><option>Islamabad</option><option>Rawalpindi</option><option>Other</option></select></div><div><label>Condition</label><select><option>Select condition</option><option>New</option><option>Like New</option><option>Good</option><option>Fair</option></select></div><div><label>What are you looking for?</label><input placeholder='e.g. Laptop, phone or console'></div><div class='full'><label>Photos</label><div class='upload'>📷<br>Product photos<br><small>Multiple images will be supported in the live version.</small></div></div><div class='full'><label>Description</label><textarea placeholder='Describe condition, accessories and anything important.'></textarea></div></div><label class='check'><input type='checkbox'> I understand that GoodsExchange only provides a platform and I will independently verify the item and other party.</label><button class='btn'>Post Item</button><div class='note'><b>Important:</b> GoodsExchange does not inspect, value, own or guarantee products.</div></form></div></div></main></body></html>
